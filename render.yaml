#################################################################
# Render Blueprint - https://render.com/docs/blueprint-spec
#
# Why this file exists: downloads shell out to yt-dlp (and ffmpeg for
# muxing), which Vercel's serverless runtime cannot do. Render builds the
# repo's Dockerfile, so both binaries land inside the container and
# downloads actually run.
#
# One-click: push this repo to GitHub, then in Render choose
# "New > Blueprint" and point it at the repo. Render reads this file.
#################################################################

services:
  - type: web
    name: komyosys-video-downloader
    # runtime: docker makes Render ignore buildCommand/startCommand and use
    # the Dockerfile at the repo root, which installs ffmpeg via apt and
    # lets postinstall drop the Linux yt-dlp binary into bin/.
    runtime: docker

    # Keep this at 1. A download is a long-lived child process, so scaling
    # out is fine but scaling in never helps, and cookie/queue state is
    # per-process.
    numInstances: 1

    # Health check reads /api/health, which reports which engines the running
    # container found. It always answers 200 while the app is up, so a bad
    # engine shows up in the JSON (ok:false) rather than as a failed deploy.
    healthCheckPath: /api/health

    # Pinned to Singapore, the closest Render region to South Asia. Render's default is
    # Oregon (USA), which roughly doubles the round-trip time for every one of the many
    # small progress polls a single download makes - visible as a laggy progress bar.
    # Other candidates: singapore | frankfurt | ohio | oregon | virginia
    region: singapore

    # Pinned to "free" (0.1 CPU / 512 MB RAM) so the Blueprint always resolves to the
    # same instance instead of inheriting whatever the dashboard defaults to.
    #
    # 0.1 CPU is the real constraint, not the RAM: a download is mostly waiting on the
    # network, but the ffmpeg merge that muxes video+audio is CPU-bound and will crawl
    # here, and Free also sleeps after 15 idle minutes. Both are acceptable for short
    # clips (Reels, TikTok, Shorts). The first thing to break on a long 1080p video is
    # the merge. When that happens change this to "starter" (0.5 CPU, 512 MB, no sleep).
    plan: free

    envVars:
      # Hard cap on the height of the video we ask each engine for, so a
      # 4K request cannot exhaust the container's ephemeral disk.
      - key: TIKTOK_MAX_HEIGHT
        value: "1080"
      - key: YOUTUBE_MAX_HEIGHT
        value: "1080"

      # Optional: private TikTok links need a logged-in session. Paste the
      # path of a cookies.txt inside the container here (for example
      # /tmp/tiktok-cookies.txt) in the Render dashboard. sync:false means
      # Render prompts for it instead of storing a value in Git.
      - key: TIKTOK_COOKIES_FILE
        sync: false

      # Optional Instagram/Facebook support. All four are prompts, never
      # committed values. Leave them empty and the feature stays disabled.
      - key: INSTAGRAM_USER_ID
        sync: false
      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false
      - key: FACEBOOK_PAGE_ID
        sync: false
      - key: FACEBOOK_PAGE_ACCESS_TOKEN
        sync: false
