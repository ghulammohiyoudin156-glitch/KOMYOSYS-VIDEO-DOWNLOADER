#################################################################
# Fly.io app config - https://fly.io/docs/reference/configuration/
#
# Fly builds the same Dockerfile, so yt-dlp and ffmpeg exist inside the
# machine and downloads work (they do not on Vercel).
#
# Deploy:
#   fly launch            # picks a name/region and reuses this file
#   fly deploy
# Then open https://<app>.fly.dev/api/health and expect "ok": true.
#
# The app name below is a placeholder - fly launch replaces it, or edit it
# to the name you own before the first deploy.
#################################################################

app = "komyosys-video-downloader"

# sin = Singapore, the closest Fly region to South Asia.
# List all with: fly platforms regions
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  # Pin the port so the platform default (Fly injects 8080) can never
  # disagree with internal_port below. Dockerfile ENV is only a default;
  # machine env wins over it.
  PORT = "3000"
  TIKTOK_MAX_HEIGHT = "1080"
  YOUTUBE_MAX_HEIGHT = "1080"
  # Secrets and cookies do not belong in this file:
  #   fly secrets set TIKTOK_COOKIES_FILE=/tmp/tiktok-cookies.txt
  #   fly secrets set INSTAGRAM_USER_ID=... INSTAGRAM_ACCESS_TOKEN=...

[http_service]
  # The container binds 0.0.0.0 on $PORT (default 3000), and the machine
  # config below pins PORT to the same value, so these always agree.
  internal_port = 3000
  force_https = true
  # Autostopping is safe here: nothing is kept in memory that matters (the
  # download history lives in the visitor's browser), and a machine will not
  # stop mid-download because an in-flight request counts as activity.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

# Same probe as everywhere else. Fly fails a deploy if this never answers.
[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  method = "GET"
  timeout = "10s"
  path = "/api/health"

# shared-cpu-1x ships 256MB; ffmpeg muxing a large file wants more. Re-running
# fly deploy re-applies whatever is in this block, so scale it here rather
# than only with fly scale.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["app"]
